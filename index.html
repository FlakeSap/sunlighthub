    <script>
      // Set the theme before the first paint so a visitor who chose light never sees a dark flash.
      try {
        document.documentElement.setAttribute(
          'data-theme',
          localStorage.getItem('sunlight-theme') === 'light' ? 'light' : 'dark',
        )
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark')
      }
    </script>
